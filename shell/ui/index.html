<!doctype html>
<html><head><meta charset="utf-8"><title>FrogComposband</title>
<link rel="stylesheet" href="ui.css">
<style>
#stage{position:absolute;left:0;top:0;transform-origin:0 0;height:1080px}
#app{height:1080px}
#term{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:#08090ae6}
#term.on{display:flex}
#term.float{background:#08090a8c}
#term.float .pane{box-shadow:0 18px 60px #000c,0 0 0 1px #000}
#banner{position:absolute;left:50%;top:44px;transform:translateX(-50%);max-width:78%;display:none;z-index:6;padding:9px 20px 10px 18px;font:500 19px/1.38 Spectral,serif;color:#f1ebe0;
 background:linear-gradient(#17191cf2,#0d0e10f2);border:1px solid #000;border-left:3px solid #ff8a3c;box-shadow:0 8px 26px #000b,inset 0 1px 0 #ffffff14;text-shadow:0 1px 2px #000}
#banner.on{display:block}
#banner .caret{display:inline-block;width:9px;height:2px;background:#ffb070;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#term .pane{padding:18px 22px;display:block}
#term canvas{width:auto;height:auto}
.live{color:#ffcf9e!important;opacity:1!important}
.mob.far{opacity:.62}
.doll .slot{cursor:pointer}
body{cursor:default;user-select:none}
#wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 34px Fell;letter-spacing:.08em;color:#ffb070}
</style></head>
<body class="main">
<div id="stage"><div id="app"><div id="wait">Waking the dungeon…</div></div><div id="term"><div class="pane"><canvas id="termc"></canvas></div></div></div>
<script src="icons.js"></script><script src="mobart.js"></script><script src="app.js"></script>
</body></html>
